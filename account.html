<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
    body{
         background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* .logo {
            background-image: url("amazon_logo.png");
            background-size: cover;
            background-position: center;
            height: 50px;
            width: 120px;
            margin-bottom: 20px;
        } */

        .card{
            width: 400px;
            margin: 20px ;
            padding: 25px;
            border-radius: 8px;
            background-color: white;
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        label{
            font-weight: bold;
            margin-top: 10px;
            display: flex;
        }
        input{
            width: 100%;
            height: 30px;
            border: 1px solid #999;
            border-radius: 4px;
        }
        button{
            width: 100%;
            height: 40px;
            margin-top: 25px;
            font-size: 20px;
            background-color: #febd68;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Account</h1>
        <form action="sign_in.html">
            <label>First Name</label>
            <input type="text" placeholder="Enter First Name" required><br>
            <label>Last Name</label>
            <input type="text" placeholder="Enter second Name" required><br>
            <label> Mobile Number</label>
            <input type="number" placeholder="Enter moblie number" required><br>
            <label>Email</label>
            <input type="email" placeholder="Enter Email " required><br>
            <label> Password</label>
            <input type="password" placeholder="Enter a password" required><br>
             <button type="submit">Registration</button>
        </form>
    </div>
    
</body>
</html>
